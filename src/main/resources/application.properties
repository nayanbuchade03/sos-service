spring.datasource.url=${SPRING_DATASOURCE_URL:fake_url_for_github}
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fake_password_for_github}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.profiles.active=local

twilio.account-sid=${TWILIO_ACCOUNT_SID:fake_sid_for_github}
twilio.auth-token=${TWILIO_AUTH_TOKEN:fake_token_for_github}
twilio.phone.from=${TWILIO_PHONE_FROM:+10000000000}
twilio.phone.to=${TWILIO_PHONE_TO:+10000000000}