<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopMap | Command & Control</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <aside id="sidebar" class="sidebar">
        <header class="sidebar-header">
            <h2>CopMap Command</h2>
            <span id="system-status" class="status-indicator">System Online</span>
        </header>
        
        <section class="controls">
            <p class="instruction-text">Click map to deploy units</p>
            <button id="btn-sos" class="btn btn-danger">Trigger SOS (Riot)</button>
            <button id="btn-refresh" class="btn btn-secondary">↻ Refresh Map</button>
        </section>

        <section class="feed-container">
            <h3>Live Dispatch Feed</h3>
            <div id="alert-feed" class="alert-feed">
                <div class="empty-state">No active dispatches</div>
            </div>
        </section>
    </aside>

    <main id="map" class="map-viewport"></main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
